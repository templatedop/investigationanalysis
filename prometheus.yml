global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Fraud Investigation API
  - job_name: 'fraud-investigation-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Fraud Investigation Worker
  - job_name: 'fraud-investigation-worker'
    static_configs:
      - targets: ['worker:8081']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Temporal (if it exposes metrics)
  - job_name: 'temporal'
    static_configs:
      - targets: ['temporal:7233']
    metrics_path: '/metrics'
    scrape_interval: 30s
